<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – AlgoViz</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="logo-icon">〈/〉</div>
      <span class="logo-text">Algo<span>Viz</span></span>
    </a>
    <div class="navbar-actions" style="margin-left:auto;">
      <button class="theme-toggle">☀️</button>
    </div>
  </nav>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg-primary);">
    <div style="background:var(--gradient-mesh);position:fixed;inset:0;pointer-events:none;"></div>
    <div style="width:100%;max-width:440px;position:relative;">
      <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:36px;box-shadow:var(--shadow-lg);">
        <div style="text-align:center;margin-bottom:28px;">
          <div style="width:56px;height:56px;background:var(--gradient-brand);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin:0 auto 14px;box-shadow:var(--shadow-orange);">🚀</div>
          <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:6px;">Create Account</h1>
          <p style="font-size:0.875rem;color:var(--text-muted);">Start your algorithm learning journey</p>
        </div>

        <div id="errorMsg" style="display:none;padding:12px 14px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);border-radius:var(--radius-sm);font-size:0.85rem;color:#ef4444;margin-bottom:16px;"></div>
        <div id="successMsg" style="display:none;padding:12px 14px;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.25);border-radius:var(--radius-sm);font-size:0.85rem;color:#22c55e;margin-bottom:16px;"></div>

        <form id="signupForm">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" id="signupName" placeholder="Your full name" required autocomplete="name">
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div style="position:relative;">
              <input type="password" class="form-input" id="signupPassword" placeholder="Minimum 6 characters" required minlength="6">
              <button type="button" onclick="togglePwd('signupPassword',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);background:none;border:none;cursor:pointer;font-size:1rem;">👁</button>
            </div>
            <!-- Password strength -->
            <div style="margin-top:8px;">
              <div class="progress-bar" style="height:4px;">
                <div class="progress-fill" id="pwdStrength" style="width:0%;transition:width 0.3s ease;"></div>
              </div>
              <span id="pwdStrengthLabel" style="font-size:0.72rem;color:var(--text-muted);"></span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-input" id="signupConfirm" placeholder="Repeat password" required>
          </div>

          <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:20px;">
            <input type="checkbox" id="acceptTerms" style="accent-color:var(--accent);margin-top:3px;" required>
            <label for="acceptTerms" style="font-size:0.82rem;color:var(--text-muted);cursor:pointer;line-height:1.5;">
              I agree to the <a href="#" style="color:var(--accent);">Terms of Service</a> and <a href="#" style="color:var(--accent);">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-full" style="font-size:0.95rem;padding:13px;" id="signupBtn">Create Account</button>
        </form>

        <div style="text-align:center;margin-top:20px;">
          <p style="font-size:0.85rem;color:var(--text-muted);">Already have an account? <a href="login.html" style="color:var(--accent);font-weight:700;">Sign In</a></p>
        </div>

        <!-- Google Sign-In Divider -->
        <div style="display:flex;align-items:center;gap:12px;margin-top:22px;">
          <div style="flex:1;height:1px;background:var(--border-subtle);"></div>
          <span style="font-size:0.75rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">or sign up with</span>
          <div style="flex:1;height:1px;background:var(--border-subtle);"></div>
        </div>

        <!-- Google Sign-Up Button -->
        <div id="googleBtnContainer" style="width:100%;margin-top:16px;display:flex;justify-content:center;"></div>
        <button type="button" id="googleSignUpBtn" onclick="handleGoogleSignUp()" style="width:100%;margin-top:8px;padding:12px 16px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);cursor:pointer;display:none;align-items:center;justify-content:center;gap:10px;font-size:0.9rem;font-weight:600;color:var(--text-primary);transition:all 0.2s ease;" onmouseover="this.style.background='var(--bg-hover)';this.style.borderColor='var(--border-color)'" onmouseout="this.style.background='var(--bg-elevated)';this.style.borderColor='var(--border-subtle)'">
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Sign up with Google
        </button>

        <!-- Benefits -->
        <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--text-muted);">
            <span style="color:#22c55e;">✓</span> Progress synced to cloud — access anywhere
          </div>
          <div style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--text-muted);">
            <span style="color:#22c55e;">✓</span> Quiz scores & achievements saved securely
          </div>
          <div style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--text-muted);">
            <span style="color:#22c55e;">✓</span> Personalized dashboard across devices
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (AuthAPI.isLoggedIn()) window.location.href = 'dashboard.html';

    // Google Sign-Up — auto-initialize with renderButton on page load
    window.addEventListener('load', () => {
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.initialize({
          client_id: '615619658013-pcgmkij39uvjppubif0sntd526vqh7na.apps.googleusercontent.com',
          callback: handleGoogleCredential,
          ux_mode: 'popup'
        });
        google.accounts.id.renderButton(
          document.getElementById('googleBtnContainer'),
          { theme: 'outline', size: 'large', width: 360, text: 'signup_with', shape: 'rectangular' }
        );
      } else {
        const fallbackBtn = document.getElementById('googleSignUpBtn');
        if (fallbackBtn) fallbackBtn.style.display = 'flex';
      }
    });

    function handleGoogleSignUp() {
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.prompt();
      } else {
        const errEl = document.getElementById('errorMsg');
        errEl.style.display = 'block';
        errEl.textContent = 'Google Sign-In is not available. Please try again later.';
      }
    }

    async function handleGoogleCredential(response) {
      const btn = document.getElementById('googleSignUpBtn');
      const errEl = document.getElementById('errorMsg');
      const succEl = document.getElementById('successMsg');
      btn.innerHTML = '⏳ Signing up with Google...';

      const res = await AuthAPI.googleLogin(response.credential);
      if (res.ok) {
        succEl.style.display = 'block';
        succEl.textContent = '🎉 Account ready! Redirecting...';
        errEl.style.display = 'none';
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } else {
        errEl.style.display = 'block';
        errEl.textContent = res.message || 'Google sign-up failed.';
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Sign up with Google';
      }
    }

    // Password strength meter
    document.getElementById('signupPassword').addEventListener('input', function() {
      const val = this.value;
      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/\d/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      const pcts = [0, 20, 40, 60, 80, 100];
      const colors = ['#3d3d5c', '#ef4444', '#f97316', '#eab308', '#22c55e', '#22c55e'];
      const labels = ['', 'Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];
      document.getElementById('pwdStrength').style.width = pcts[strength] + '%';
      document.getElementById('pwdStrength').style.background = colors[strength];
      document.getElementById('pwdStrengthLabel').textContent = labels[strength];
      document.getElementById('pwdStrengthLabel').style.color = colors[strength];
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;
      const errEl = document.getElementById('errorMsg');
      const succEl = document.getElementById('successMsg');

      if (password !== confirm) {
        errEl.style.display = 'block';
        errEl.textContent = 'Passwords do not match.';
        return;
      }
      const btn = document.getElementById('signupBtn');
      btn.innerHTML = '⏳ Creating account...'; btn.disabled = true;

      const res = await AuthAPI.signup(name, email, password);
      if (res.ok) {
        succEl.style.display = 'block';
        succEl.textContent = '🎉 Account created! Redirecting...';
        errEl.style.display = 'none';
        setTimeout(() => window.location.href = 'dashboard.html', 1200);
      } else {
        errEl.style.display = 'block';
        errEl.textContent = res.message || 'Signup failed. Please try again.';
        btn.innerHTML = 'Create Account'; btn.disabled = false;
      }
    });

    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? '👁' : '🙈';
    }
  </script>
</body>
</html>
