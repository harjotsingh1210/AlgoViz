<html lang="en" data-theme="dark">
<head>

  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – AlgoViz</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg-primary);">
    <div style="background:var(--gradient-mesh);position:fixed;inset:0;pointer-events:none;"></div>
    <div style="width:100%;max-width:400px;position:relative;">
      <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:36px;box-shadow:var(--shadow-lg);">
        <div style="text-align:center;margin-bottom:28px;">
          <div style="width:56px;height:56px;background:linear-gradient(135deg,#1e1e2a,#2d2d40);border:2px solid var(--border-color);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin:0 auto 14px;">🛡️</div>
          <h1 style="font-size:1.4rem;font-weight:800;margin-bottom:4px;">Admin Panel</h1>
          <p style="font-size:0.82rem;color:var(--text-muted);">Authorized access only</p>
        </div>
        <div id="errorMsg" style="display:none;padding:10px 14px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-sm);font-size:0.85rem;color:#ef4444;margin-bottom:14px;"></div>
        <form id="adminLoginForm">
          <div class="form-group">
            <label class="form-label">Admin Email</label>
            <input type="email" class="form-input" id="adminEmail" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="adminPassword" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary w-full" id="adminLoginBtn" style="font-size:0.95rem;padding:12px;">Access Admin Dashboard</button>
        </form>
        <div style="text-align:center;margin-top:16px;">
          <a href="../index.html" style="font-size:0.82rem;color:var(--text-muted);">← Back to main site</a>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/theme.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // Only this email can access admin
    const ADMIN_EMAIL = 'a4ansh5@gmail.com';

    // Redirect if already logged in as admin
    if (AuthAPI.isLoggedIn() && AuthAPI.isAdmin()) {
      const u = AuthAPI.getUser();
      if (u && u.email === ADMIN_EMAIL) {
        window.location.href = 'dashboard.html';
      } else {
        AuthAPI.logout();
      }
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPassword').value;
      const btn = document.getElementById('adminLoginBtn');
      const errEl = document.getElementById('errorMsg');

      // Whitelist check — block before even calling the API
      if (email.toLowerCase() !== ADMIN_EMAIL) {
        errEl.style.display = 'block';
        errEl.textContent = '⛔ Access denied. You are not authorized.';
        return;
      }

      btn.innerHTML = '⏳ Verifying...'; btn.disabled = true;

      const res = await AuthAPI.login(email, pass);
      if (res.ok) {
        const user = AuthAPI.getUser();
        if (user && user.email === ADMIN_EMAIL) {
          window.location.href = 'dashboard.html';
        } else {
          errEl.style.display = 'block';
          errEl.textContent = '⛔ Access denied. You are not authorized.';
          AuthAPI.logout();
        }
      } else {
        errEl.style.display = 'block';
        errEl.textContent = res.message || 'Invalid credentials.';
        btn.innerHTML = 'Access Admin Dashboard'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
