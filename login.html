<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – AlgoViz</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="logo-icon">〈/〉</div>
      <span class="logo-text">Algo<span>Viz</span></span>
    </a>
    <div class="navbar-actions" style="margin-left:auto;">
      <button class="theme-toggle">☀️</button>
    </div>
  </nav>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg-primary);">
    <div style="background:var(--gradient-mesh);position:fixed;inset:0;pointer-events:none;"></div>
    <div style="width:100%;max-width:420px;position:relative;">
      <!-- Card -->
      <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:36px;box-shadow:var(--shadow-lg);">
        <div style="text-align:center;margin-bottom:28px;">
          <div style="width:56px;height:56px;background:var(--gradient-brand);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin:0 auto 14px;box-shadow:var(--shadow-orange);">〈/〉</div>
          <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:6px;">Welcome Back</h1>
          <p style="font-size:0.875rem;color:var(--text-muted);">Sign in to your AlgoViz account</p>
        </div>

        <div id="errorMsg" style="display:none;padding:12px 14px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);border-radius:var(--radius-sm);font-size:0.85rem;color:#ef4444;margin-bottom:16px;"></div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" style="display:flex;justify-content:space-between;">
              Password
              <a href="forgot.html" style="color:var(--accent);font-size:0.78rem;font-weight:600;">Forgot password?</a>
            </label>
            <div style="position:relative;">
              <input type="password" class="form-input" id="loginPassword" placeholder="Your password" required autocomplete="current-password">
              <button type="button" onclick="togglePwd('loginPassword',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:1rem;background:none;border:none;cursor:pointer;">👁</button>
            </div>
          </div>

          <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
            <input type="checkbox" id="rememberMe" style="accent-color:var(--accent);">
            <label for="rememberMe" style="font-size:0.85rem;color:var(--text-muted);cursor:pointer;">Remember me</label>
          </div>

          <button type="submit" class="btn btn-primary w-full" style="font-size:0.95rem;padding:13px;" id="loginBtn">Sign In</button>
        </form>

        <div style="text-align:center;margin-top:20px;">
          <p style="font-size:0.85rem;color:var(--text-muted);">Don't have an account? <a href="signup.html" style="color:var(--accent);font-weight:700;">Sign Up Free</a></p>
        </div>

        <!-- Google Sign-In Divider -->
        <div style="display:flex;align-items:center;gap:12px;margin-top:22px;">
          <div style="flex:1;height:1px;background:var(--border-subtle);"></div>
          <span style="font-size:0.75rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">or continue with</span>
          <div style="flex:1;height:1px;background:var(--border-subtle);"></div>
        </div>

        <!-- Google Sign-In Button -->
        <button type="button" id="googleSignInBtn" onclick="handleGoogleSignIn()" style="width:100%;margin-top:16px;padding:12px 16px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-size:0.9rem;font-weight:600;color:var(--text-primary);transition:all 0.2s ease;" onmouseover="this.style.background='var(--bg-hover)';this.style.borderColor='var(--border-color)'" onmouseout="this.style.background='var(--bg-elevated)';this.style.borderColor='var(--border-subtle)'">
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Sign in with Google
        </button>

        <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border-subtle);">
          <p style="font-size:0.72rem;text-align:center;color:var(--text-muted);margin-bottom:10px;">Or try as:</p>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary w-full btn-sm" onclick="demoLogin('demo@algoviz.com','demo1234')">👤 Demo User</button>
            <button class="btn btn-secondary w-full btn-sm" onclick="demoLogin('admin@algoviz.com','admin1234','admin')">🔑 Admin</button>
          </div>
        </div>
      </div>

      <p style="text-align:center;font-size:0.78rem;color:var(--text-muted);margin-top:16px;">
        <a href="admin/login.html" style="color:var(--text-muted);">Admin panel →</a>
      </p>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (AuthAPI.isLoggedIn()) window.location.href = 'dashboard.html';

    // Show expiry notice
    if (new URLSearchParams(window.location.search).get('expired')) {
      const msg = document.getElementById('errorMsg');
      msg.style.display = 'block';
      msg.textContent = '⏰ Your session expired. Please sign in again.';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');
      btn.innerHTML = '⏳ Signing in...'; btn.disabled = true;

      const res = await AuthAPI.login(email, password);
      if (res.ok) {
        Toast.show('Welcome back! 🎉', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } else {
        errEl.style.display = 'block';
        errEl.textContent = res.message || 'Login failed.';
        btn.innerHTML = 'Sign In'; btn.disabled = false;
      }
    });

    // Google Sign-In handler
    function handleGoogleSignIn() {
      google.accounts.id.initialize({
        client_id: '615619658013-pcgmkij39uvjppubif0sntd526vqh7na.apps.googleusercontent.com',
        callback: handleGoogleCredential
      });
      google.accounts.id.prompt();
    }

    async function handleGoogleCredential(response) {
      const btn = document.getElementById('googleSignInBtn');
      const errEl = document.getElementById('errorMsg');
      btn.innerHTML = '⏳ Signing in with Google...';

      const res = await AuthAPI.googleLogin(response.credential);
      if (res.ok) {
        Toast.show('Welcome! 🎉', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } else {
        errEl.style.display = 'block';
        errEl.textContent = res.message || 'Google sign-in failed.';
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Sign in with Google';
      }
    }

    async function demoLogin(email, pass, role) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pass;
      let res = await AuthAPI.login(email, pass);
      if (!res.ok && res.status !== 403) {
        const name = role === 'admin' ? 'Admin User' : 'Demo User';
        await AuthAPI.signup(name, email, pass);
        // Don't redirect on auto-created login
        if (role === 'admin') {
          res = await AuthAPI.login(email, pass);
        }
      }
      if (res.ok) {
        if (role === 'admin' || res.user?.isAdmin) {
          window.location.href = 'admin/dashboard.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } else {
        Toast.show(res.message || 'Demo login failed', 'error');
      }
    }

    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? '👁' : '🙈';
    }
  </script>
</body>
</html>
